<app-track-search
  (searchTermChanged)="onSearchTermChanged($event)"
/>

<section class="grid">
  @for (track of filteredTracks(); track track.id) {
  <app-track-card
    [track]="track"
    [active]="track.id === selection()"
    (select)="selectTrack($event)"
  />
  } @empty {
    <p>Aucun morceau.</p>
  }
</section>
